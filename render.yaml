services:
  - type: web
    name: feature-tech-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://temporal.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
